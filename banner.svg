<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luigi Mari, Quantitative Finance">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1526"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="280" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.04">
    <line x1="0" y1="70"  x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="200"  y1="0" x2="200"  y2="280"/>
    <line x1="400"  y1="0" x2="400"  y2="280"/>
    <line x1="600"  y1="0" x2="600"  y2="280"/>
    <line x1="800"  y1="0" x2="800"  y2="280"/>
    <line x1="1000" y1="0" x2="1000" y2="280"/>
  </g>

  <!-- equity-curve motif, right half -->
  <path d="M 640 216 C 700 208, 736 232, 790 196 S 880 150, 930 168 S 1020 120, 1064 132 C 1100 142, 1120 96, 1148 78"
        fill="none" stroke="url(#acc)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 640 216 C 700 208, 736 232, 790 196 S 880 150, 930 168 S 1020 120, 1064 132 C 1100 142, 1120 96, 1148 78 L 1148 252 L 640 252 Z"
        fill="#F5A623" fill-opacity="0.05"/>
  <circle cx="1148" cy="78" r="9" fill="#F5A623" fill-opacity="0.25"/>
  <circle cx="1148" cy="78" r="4.5" fill="#F5A623"/>

  <!-- identity, left -->
  <text x="56" y="128" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#E9EEF8">Luigi Mari</text>
  <rect x="58" y="148" width="52" height="4" rx="2" fill="#F5A623"/>
  <text x="56" y="188" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#93A0B8">Quantitative Finance &#183; Machine Learning &#183; Risk Management</text>
  <text x="56" y="224" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#5D6B85">github.com/luigi-mari</text>
</svg>
